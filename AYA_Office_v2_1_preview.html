<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYA Office | YouTube企画室 v2.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#f3f8f6;color:#253e38;margin:0;padding:22px}main{max-width:700px;margin:auto}h1{font-size:36px}small{color:#647d76}.card{background:white;border-radius:25px;padding:24px;margin:22px 0;box-shadow:0 5px 20px #173b3010}label{display:block;font-weight:bold;margin:18px 0 8px}input,select,textarea{box-sizing:border-box;width:100%;border:2px solid #d4e1dd;border-radius:15px;padding:14px;font:inherit;background:white}button{background:#287c70;color:white;border:0;border-radius:16px;padding:17px;width:100%;font-weight:bold;font-size:18px;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.8}h2{font-size:24px}.muted{font-size:14px;color:#627770}</style></head><body><main><h1>AYA Office</h1><p>🎬 YouTube企画室 v2.1 — 独立プレビュー</p><section class="card"><h2>今日の企画を作る</h2><label for="theme">動画テーマ</label><input id="theme" value="528Hz 睡眠用ヒーリング音楽"><label for="duration">動画の長さ</label><select id="duration"><option>10分</option><option selected>30分</option><option>1時間</option><option>3時間</option></select><label for="mood">世界観</label><select id="mood"><option selected>深い青・静かな夜・透明感</option><option>朝の光・湧水・緑</option><option>ラベンダー・星空・宇宙</option><option>神社・祈り・神聖な空気</option></select><button id="make">企画案を作成</button></section><section class="card" id="result" hidden><h2>✨ 完成した企画案</h2><pre id="output"></pre><button id="copy">企画案をコピー</button><p id="status" class="muted"></p></section><p class="muted">このページは端末内で企画文を作る試作版です。AIへの自動接続、動画生成、YouTubeへの自動投稿は行いません。既存のAYA Officeには影響しません。</p></main><script>const $=id=>document.getElementById(id);let latest='';$('make').onclick=()=>{const t=$('theme').value.trim()||'睡眠用ヒーリング音楽',d=$('duration').value,m=$('mood').value;latest=`【AYA Office｜YouTube企画案】\nテーマ：${t}\n長さ：${d}\n世界観：${m}\n\n■ タイトル案\n${t}｜${d}の静かなリラックスタイム・瞑想BGM\n\n■ サムネイル案\n${m}を背景に、余白を広く取り、読みやすい文字で「深くやすらぐ ${d}」。\n\n■ 概要欄案\n静かな時間を過ごしたい夜に。${t}をテーマにした穏やかな音楽です。休息・読書・瞑想など、ご自身のペースでお楽しみください。\n※特定の周波数による医学的効果を保証するものではありません。\n\n■ Suno用プロンプト\nInstrumental ambient healing music inspired by ${t}. ${m}. Soft evolving pads, delicate crystal bowls, subtle bells, minimal melody, no drums, no sudden loud changes, calm and seamless atmosphere, suitable for relaxation and sleep.\n\n■ 制作チェック\n□ 音源を聴いて確認\n□ 映像・サムネイルを制作\n□ 音量とループのつなぎ目を確認\n□ タイトルと概要欄を設定\n□ 著作権・利用条件を確認\n□ 投稿後にクリック率と視聴維持率を確認`; $('output').textContent=latest;$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth'});};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(latest);$('status').textContent='コピーしました';}catch(e){$('status').textContent='コピーできない場合は、文章を長押しして選択してください';}};</script></body></html>
