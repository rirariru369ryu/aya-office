<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYA Office v2.2 | AI社員会議室・試作版</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#edf9f6,#f3efff 65%,#fff8fa);color:#27394a;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif}main{max-width:780px;margin:auto;padding:24px 16px 70px}.top{padding:20px 6px 4px}.eyebrow{letter-spacing:.15em;color:#647b92;font-size:12px;font-weight:700}h1{font-size:clamp(27px,6vw,38px);margin:10px 0}p{line-height:1.7}.pill{display:inline-block;border-radius:30px;background:#fff;color:#66728d;padding:7px 12px;font-size:12px;font-weight:700}.card{background:#ffffffeb;border:1px solid #ffffff;border-radius:23px;padding:20px;margin-top:18px;box-shadow:0 10px 35px #667a9c13}h2{font-size:20px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input,select,textarea{font:inherit;width:100%;border:1px solid #cdd8e1;border-radius:12px;background:white;padding:12px;color:#27394a}textarea{min-height:78px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}button{border:0;border-radius:14px;padding:15px 18px;font:inherit;font-weight:800;background:#7568ca;color:white;width:100%;margin-top:18px;cursor:pointer}button.secondary{background:#e8e5f8;color:#493e8c}.note{font-size:12px;color:#6c7686}.speaker{display:flex;align-items:center;gap:9px;margin:20px 0 7px;font-weight:800}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:#eeeafa}.talk{background:#f6f8ff;border-radius:14px;padding:13px 15px;line-height:1.75;white-space:pre-wrap}.hidden{display:none}.out{white-space:pre-wrap;line-height:1.75}.divider{border-top:1px solid #e9edf2;margin:18px 0}.footer{font-size:12px;color:#687486;margin-top:18px}</style></head><body><main><header class="top"><div class="eyebrow">AYA OFFICE / YOUTUBE TEAM</div><h1>🌈 AI社員会議室 <span style="font-size:16px">v2.2</span></h1><p>ソラ社長・企画部・動画部・分析部が、次のYouTube動画を考える会議室。</p><span class="pill">安全な試作版｜API未接続・課金なし</span></header><section class="card"><h2>📋 今日の会議テーマ</h2><label for="genre">優先ジャンル</label><select id="genre"><option value="sleep">睡眠・528Hzヒーリング</option><option value="prayer">祝詞・祈り</option><option value="cosmos">宇宙・963Hz瞑想</option><option value="nature">自然・聖なる大地</option></select><div class="grid"><div><label for="views">直近動画の再生回数（任意）</label><input id="views" type="number" min="0" placeholder="例：120"></div><div><label for="ctr">クリック率 %（任意）</label><input id="ctr" type="number" min="0" max="100" step="0.1" placeholder="例：3.2"></div></div><label for="retention">平均視聴維持率 %（任意）</label><input id="retention" type="number" min="0" max="100" step="0.1" placeholder="例：28"></div><label for="memo">あやからのひとこと（任意）</label><textarea id="memo" placeholder="例：青紫の星空が好き。今回は30分にしたい"></textarea><button id="meeting">✨ 社員会議を始める</button><p class="note">入力内容はこの画面内で処理します。実際のYouTubeデータは自動取得しません。</p></section><section class="card hidden" id="result" aria-live="polite"><h2>📝 本日の会議録</h2><div id="conversation"></div><div class="divider"></div><h2>🎬 制作指示書</h2><div id="brief" class="out"></div><button class="secondary" id="copy">📋 会議録と指示書をコピー</button><p id="copyStatus" class="note"></p></section><p class="footer">v2.2はAI会議の画面と作業フローを検証する試作版です。発言はテンプレートで生成され、OpenAI APIには接続していません。APIキーをこの画面に入力しないでください。公開中の既存AYA Officeには影響しません。</p></main><script>
const $=id=>document.getElementById(id);
const plans={sleep:{topic:'528Hzをテーマにした深い睡眠のための30分BGM',title:'【睡眠用BGM 30分】静かな夜にほどける心｜528Hzをテーマにした癒しの音楽',thumb:'深い藍色の夜空、やわらかな月光、文字は「深い眠りへ」だけ',sound:'Very gentle ambient sleep music inspired by 528Hz, soft evolving pads, warm crystal bowls, no drums, no sudden peaks, slow seamless ending, calm spacious atmosphere, 30-minute sleep ambience.',description:'一日の終わりに、静かな音に包まれる30分。深呼吸しながら、ゆったりとお過ごしください。※周波数による医療的効果を保証するものではありません。'},prayer:{topic:'心を整える静かな祈りの音楽',title:'【朝の祈り】心を静かに整える、やさしい祝詞の時間',thumb:'朝靄の神社と淡い光、文字は「朝の祈り」',sound:'Gentle sacred Japanese-inspired ambient music, delicate bells, subtle drones, peaceful female vocal textures without unintelligible words, slow and reverent, no drums.',description:'静かな朝、祈りとともに心を整えるひととき。音と言葉の余韻を大切にした作品です。'},cosmos:{topic:'963Hzをテーマにした宇宙瞑想',title:'【宇宙瞑想】星の静けさに包まれる30分｜963Hzをテーマに',thumb:'青紫の星雲と細い光の輪、文字は「宇宙の静けさ」',sound:'Ethereal cosmic ambient meditation, deep blue violet atmosphere, airy pads, soft crystal bowls, delicate distant bells, no percussion, slow evolving harmonics, smooth quiet dynamics.',description:'青紫の星空をイメージした静かな瞑想音楽。呼吸を整え、穏やかな時間をお楽しみください。'},nature:{topic:'聖なる大地をイメージした自然系ヒーリング',title:'【Sacred Earth】大地の鼓動と静かな祈り｜自然を感じる音楽',thumb:'朝日の差す緑の森と大地、文字は「Sacred Earth」',sound:'Sacred earth-inspired cinematic ambient, gentle organic hand percussion, warm flutes, airy female vocal textures, earthy resonance, calm expansive landscape, gradual transitions.',description:'大地のぬくもりと祈りをイメージした音楽。自然の情景を思い浮かべながらお聴きください。'}};
function addTalk(name,emoji,msg){const wrap=document.createElement('div'),head=document.createElement('div'),bubble=document.createElement('div');head.className='speaker';const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=emoji;head.append(avatar,document.createTextNode(name));bubble.className='talk';bubble.textContent=msg;wrap.append(head,bubble);$('conversation').append(wrap)}
$('meeting').addEventListener('click',()=>{const p=plans[$('genre').value],views=$('views').value,ctr=$('ctr').value,ret=$('retention').value,memo=$('memo').value.trim();$('conversation').replaceChildren();const observations=[];if(views!=='')observations.push('直近の再生回数は'+views+'回');if(ctr!=='')observations.push('クリック率は'+ctr+'%');if(ret!=='')observations.push('平均視聴維持率は'+ret+'%');const analysis=observations.length?observations.join('、')+'。': '実績データは未入力なので、まず仮説を立ててテストします。';const issues=[];if(ctr!==''&&Number(ctr)<4)issues.push('サムネイルとタイトルを2案比較する');if(ret!==''&&Number(ret)<30)issues.push('冒頭30秒の音量変化を抑えて離脱を確認する');if(views!==''&&Number(views)<300)issues.push('関連動画からの導線と再生リストを整える');if(!issues.length)issues.push('公開後48時間のクリック率・視聴維持率を確認する');addTalk('ソラ社長','🌈','今日の優先テーマは「'+p.topic+'」。まず1本を丁寧に育てよう。'+(memo?' あやの希望：「'+memo+'」も制作条件に入れます。':''));addTalk('企画部','💡','検索意図を明確にしたタイトル案はこちら。\n'+p.title);addTalk('動画部','🎬','サムネイルは「'+p.thumb+'」。Sunoでは急な音量変化を避け、映像と音の統一感を重視します。');addTalk('分析部','📊',analysis+'\n次の確認項目：'+issues.join('／'));const brief='【テーマ】\n'+p.topic+'\n\n【タイトル案】\n'+p.title+'\n\n【サムネイル案】\n'+p.thumb+'\n\n【概要欄のたたき台】\n'+p.description+'\n\n【Sunoプロンプト】\n'+p.sound+'\n\n【公開後の確認】\n'+issues.map(x=>'□ '+x).join('\n')+'\n\n【制作メモ】\n'+(memo||'なし')+'\n\n※これはテンプレートによる試作案。AIによる自動分析ではありません。';$('brief').textContent=brief;$('result').classList.remove('hidden');$('copyStatus').textContent='';$('result').scrollIntoView({behavior:'smooth',block:'start'})});$('copy').addEventListener('click',async()=>{const text=[...$('conversation').querySelectorAll('.speaker,.talk')].map(e=>e.textContent).join('\n')+'\n\n'+$('brief').textContent;try{await navigator.clipboard.writeText(text);$('copyStatus').textContent='コピーできました！'}catch(e){$('copyStatus').textContent='コピーできない場合は、文章を長押しして選択してください。'}});
</script></body></html>
