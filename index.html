<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0f766e'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='apple-mobile-web-app-title' content='AYA Office'><link rel='apple-touch-icon' href='icon.png'><link rel='manifest' href='manifest.webmanifest'><title>AYA Office</title><style>:root{--j:#0f766e;--p:#eef8f4;--g:#c7a24c;--t:#20322f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:linear-gradient(160deg,#edf7f3,#fbf6ea);color:var(--t)}main{max-width:480px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}.card{background:#fffdf9;border:1px solid #e8dfcf;border-radius:28px;padding:18px;box-shadow:0 14px 40px #315c501a}.head{display:flex;align-items:center;gap:12px}.head img{width:62px;height:62px;border-radius:18px;object-fit:cover}.head small{letter-spacing:.22em;color:#71817d}.head h1{margin:3px 0;font-size:25px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.tabs button{border:0;border-radius:14px;padding:10px 3px;background:#edf2f0}.tabs button.on{background:#d9f1e9;color:#08655e;font-weight:700}.panel{display:none}.panel.on{display:block}.box{background:#f4f8f6;border-radius:18px;padding:14px;margin-bottom:12px}textarea,input{width:100%;border:1px solid #d6dfdc;background:white;border-radius:13px;padding:12px;font:inherit;margin-top:8px}textarea{height:96px;resize:vertical}.btn{width:100%;border:0;border-radius:14px;padding:13px;margin-top:9px;background:var(--j);color:#fff;font-weight:700}.chat{display:grid;gap:8px;margin-top:10px}.bubble{background:#fff;border-left:3px solid var(--g);border-radius:12px;padding:10px}.result{white-space:pre-wrap;line-height:1.65}.row{display:flex;gap:7px}.row>*{flex:1}.item{display:flex;justify-content:space-between;background:#fff;border-radius:12px;padding:10px;margin-top:8px}.muted{color:#75827f;font-size:12px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{min-height:48px;background:#fff;border-radius:9px;padding:4px;text-align:center;font-size:11px}.footer{text-align:center;color:#87938f;font-size:11px;margin-top:15px}</style></head><body><main><div class='card'><div class='head'><img src='icon.png' alt='AYA Office'><div><small>WHITE DRAGON EDITION</small><h1>AYA Office</h1><div class='muted'>あや和結ひ AIチーム</div></div></div><div class='tabs'><button class='on' data-p='hq'>🏛<br>社長</button><button data-p='reel'>📸<br>リール</button><button data-p='voice'>🎙<br>台本</button><button data-p='cal'>📅<br>予定</button><button data-p='stock'>📦<br>在庫</button></div>
<section id='hq' class='panel on'><div class='box'><b>社長からの指令</b><textarea id='mission' placeholder='例：新作の精麻ネックレスのリールを作って'></textarea><button class='btn' id='dispatch'>全社員へ指示する</button></div><div class='box'><b>社員会議</b><div id='chat' class='chat'><div class='bubble'>🏛 社長室ソラ「おはようございます。指令をお待ちしています🌿」</div></div></div></section>
<section id='reel' class='panel'><div class='box'><b>写真 → リール企画</b><input id='photo' type='file' accept='image/*'><img id='preview' style='display:none;width:100%;margin-top:10px;border-radius:14px'><textarea id='reelTopic' placeholder='写真について一言（例：中秋の名月に作った精麻しめ縄）'></textarea><button class='btn' id='makeReel'>15カット案を作る</button><div id='reelOut' class='result'></div></div></section>
<section id='voice' class='panel'><div class='box'><b>AI音声用 台本</b><textarea id='voiceTopic' placeholder='テーマを入力'></textarea><button class='btn' id='makeVoice'>読み上げ台本を作る</button><div id='voiceOut' class='result'></div></div></section>
<section id='cal' class='panel'><div class='box'><b>投稿カレンダー</b><div class='row'><input id='postDate' type='date'><input id='postTitle' placeholder='投稿名'></div><button class='btn' id='addPost'>予定を保存</button><div id='postList'></div></div></section>
<section id='stock' class='panel'><div class='box'><b>作品・在庫・売上</b><input id='itemName' placeholder='作品名'><div class='row'><input id='itemPrice' type='number' placeholder='価格'><input id='itemQty' type='number' placeholder='在庫' value='1'></div><button class='btn' id='addItem'>作品を登録</button><div id='stockList'></div><div id='sales' class='muted' style='margin-top:10px'></div></div></section><div class='footer'>AYA Office v1.0 • データはこの端末に保存</div></div></main><script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$$('.panel').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.p).classList.add('on')});
const sleep=m=>new Promise(r=>setTimeout(r,m));$('#dispatch').onclick=async()=>{let task=$('#mission').value.trim()||'今週の投稿企画';let msgs=[`🏛 社長室ソラ「${task}、受け付けました。担当を招集します」`,`🌿 企画ソラ「目的と世界観を整理します。売り込みすぎず、作品の背景が伝わる軸にします」`,`🎥 監督ソラ「企画を15カットへ展開します。冒頭3秒→制作過程→完成→余韻の順で組みます」`,`🎨 美術ソラ「翡翠・生成り・金を軸に、余白のある画面を提案します」`,`🪢 作品ソラ「素材と制作意図を事実と表現に分け、説明文を整えます」`,`🏛 社長室ソラ「各部署案をまとめました。社長承認待ちです🌿」`];$('#chat').innerHTML='';for(let m of msgs){let d=document.createElement('div');d.className='bubble';d.textContent=m;$('#chat').append(d);await sleep(350)}};
$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);$('#preview').src=u;$('#preview').style.display='block'};$('#makeReel').onclick=()=>{let t=$('#reelTopic').value.trim()||'この作品';let cuts=['作品全景','素材のアップ','手に取る瞬間','精麻の繊維','結び始め','手元の動き','途中の形','光に透かす','細部','完成直前','完成全景','身につける／飾る','自然光のカット','余韻の静止画','ブランド名＋短い言葉'];$('#reelOut').textContent=`🎬 ${t}\n\n${cuts.map((x,i)=>String(i+1).padStart(2,'0')+'｜'+x).join('\n')}\n\n字幕案：手で結ぶ時間も、作品の一部。`};$('#makeVoice').onclick=()=>{let t=$('#voiceTopic').value.trim()||'この作品';$('#voiceOut').textContent=`「${t}」。\nひとつひとつ、素材の表情を見ながら手で結びました。\n形だけではなく、その時間まで大切にしたい。\n日々の暮らしの中で、ふと心が静かになるような存在になりますように。`};
let posts=JSON.parse(localStorage.getItem('aya_posts')||'[]');let stock=JSON.parse(localStorage.getItem('aya_stock')||'[]');function save(){localStorage.setItem('aya_posts',JSON.stringify(posts));localStorage.setItem('aya_stock',JSON.stringify(stock))}function renderPosts(){$('#postList').innerHTML=posts.sort((a,b)=>a.date.localeCompare(b.date)).map((p,i)=>`<div class='item'><span>${p.date}<br><b>${p.title}</b></span><button onclick='delPost(${i})'>削除</button></div>`).join('')||`<div class='muted' style='margin-top:10px'>予定はまだありません</div>`}window.delPost=i=>{posts.splice(i,1);save();renderPosts()};$('#addPost').onclick=()=>{if(!$('#postDate').value||!$('#postTitle').value.trim())return;posts.push({date:$('#postDate').value,title:$('#postTitle').value.trim()});save();renderPosts();$('#postTitle').value=''};
function renderStock(){let revenue=0;$('#stockList').innerHTML=stock.map((s,i)=>{revenue+=(s.sold||0)*s.price;return `<div class='item'><span><b>${s.name}</b><br>¥${s.price.toLocaleString()}｜在庫 ${s.qty}｜販売 ${s.sold||0}</span><span><button onclick='sell(${i})'>販売</button> <button onclick='delItem(${i})'>削除</button></span></div>`}).join('')||`<div class='muted' style='margin-top:10px'>作品はまだありません</div>`;$('#sales').textContent='記録売上：¥'+revenue.toLocaleString()}window.sell=i=>{if(stock[i].qty>0){stock[i].qty--;stock[i].sold=(stock[i].sold||0)+1;save();renderStock()}};window.delItem=i=>{stock.splice(i,1);save();renderStock()};$('#addItem').onclick=()=>{let n=$('#itemName').value.trim(),p=+$('#itemPrice').value,q=+$('#itemQty').value;if(!n||!p)return;stock.push({name:n,price:p,qty:q||1,sold:0});save();renderStock();$('#itemName').value='';$('#itemPrice').value=''};renderPosts();renderStock();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
