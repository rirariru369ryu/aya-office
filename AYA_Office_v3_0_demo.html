<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYA Office v3.0｜AI会議室・接続準備版</title><style>body{margin:0;background:#f4f5ff;color:#29304b;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:650px;margin:auto;padding:22px 16px 60px}h1{color:#5e5aa8;font-size:25px}.tag{display:inline-block;background:#e6e3ff;color:#4e488f;border-radius:30px;padding:7px 12px;font-size:12px}.panel{background:white;border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 3px 14px #37376410}label{display:block;font-weight:bold;margin:13px 0 5px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd1e5;border-radius:10px;font-size:16px;background:#fff}button{border:0;background:#7770c6;color:white;border-radius:12px;padding:15px 20px;font-size:16px;font-weight:bold;width:100%;margin-top:15px}button:disabled{opacity:.5}.note{font-size:13px;line-height:1.8;color:#626783}.person{border-left:4px solid #a6a1e7;padding:10px 13px;margin:12px 0;background:#fafaff;border-radius:6px;white-space:pre-wrap;line-height:1.7}#result{display:none}footer{font-size:12px;color:#686d87;margin-top:20px;line-height:1.7}</style></head><body><main><span class="tag">v3.0 接続準備版・デモ</span><h1>🌈 AYA Office｜AI社員会議室</h1><p>あやのYouTube制作を支える、ソラ社長とAI社員の企画会議。</p><section class="panel"><b>現在の状態：オフラインデモ</b><p class="note">この版はまだOpenAI APIに接続していません。表示される会議内容は入力に応じたテンプレートで、実際のAI推論ではありません。API料金は発生しません。</p><label for="topic">今日のテーマ</label><input id="topic" value="528Hz 睡眠用ヒーリング音楽"><label for="duration">動画の長さ</label><select id="duration"><option>30分</option><option>1時間</option><option>10分</option><option>3時間</option></select><label for="mood">世界観</label><textarea id="mood" rows="2">深い青とラベンダー、静かな星空、穏やかな夜</textarea><label for="numbers">直近の再生数・課題（任意）</label><textarea id="numbers" rows="2" placeholder="例：直近7日で120再生。冒頭で離脱が多い"></textarea><button id="start">会議を開始（デモ）</button></section><section class="panel" id="result"><h2>📋 今日の会議結果</h2><div id="meeting"></div><button id="copy">会議結果をコピー</button></section><footer>🔒 APIキーをこのページやGitHubに入力しないでください。本物のAI接続には、サーバー側での秘密情報管理・認証・利用制限・料金監視が必要です。公開中の既存AYA Officeには影響しません。</footer></main><script>const $=id=>document.getElementById(id);let copyText='';$('start').onclick=()=>{const topic=$('topic').value.trim()||'睡眠用ヒーリング音楽',duration=$('duration').value,mood=$('mood').value.trim(),numbers=$('numbers').value.trim();const roles=[['🌈 ソラ社長',`今日の優先企画は「${topic}」。視聴者が用途をすぐ理解できる動画にします。尺は${duration}。`],['💡 企画部',`仮タイトル：「【${duration}】${topic}｜眠る前に心を整える静かな音楽」\n想定視聴者：寝る前に落ち着いた音楽を探している人。`],['🎬 動画部',`サムネイル：${mood||'落ち着いた青のグラデーション'}。文字は短く「深い眠り」「${duration}」。\nSuno指示：Instrumental ambient music for sleep; gentle pads, soft bells, slow evolution, no percussion, no abrupt transitions. Mood: ${mood||'calm night'}.`],['📊 分析部',numbers?`入力された状況：${numbers}\n次回はクリック率、冒頭30秒の維持率、平均視聴時間を確認し、サムネと導入を比較します。`:'再生データ未入力。公開後にクリック率、平均視聴時間、冒頭30秒の維持率を記録しましょう。'],['📝 制作指示',`① 音源を制作 ② サムネイルを作成 ③ ${duration}に編集 ④ タイトルと説明文を確認 ⑤ 公開後のデータを記録`]];$('meeting').replaceChildren();copyText=roles.map(([name,body])=>name+'\n'+body).join('\n\n');for(const [name,body] of roles){const d=document.createElement('div');d.className='person';const strong=document.createElement('strong');strong.textContent=name;d.append(strong,document.createTextNode('\n'+body));$('meeting').appendChild(d)}$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'});};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(copyText);$('copy').textContent='コピーしました ✓'}catch{alert('コピーできない場合は文章を長押しして選択してください')}};</script></body></html>
